- title: "Organizers"
  presenter: "Makrina Diakaki"
  url: https://www.wur.nl/en/persons/makrina-diakaki.htm
  affiliation: "Wageningen University & Research"
  photo: "makrina-diakaki"
  biography: "Makrina started her PhD in July 2020 studying the role of the seed microbiome in seed health and seed resilience against pathogens. She organizes and chairs the Seed Microbiome Working Group for early career researchers."

- presenter: "Carolina Lobato"
  url: https://cbclobato.github.io/
  affiliation: "Graz University of Technology"
  photo: "carolina-lobato"
  biography: "Carolina is a PhD candidate at the Institute of Environmental Biotechnology, Graz University of Technology. Her research explores how microbial interactions influence plant fitness and health, with a focus on seed microbial community assembly. She investigates the factors shaping microbiome composition and function, including microbial inheritance, environmental influences, and host traits. A key aspect of her work is understanding how these microbial assembly patterns impact plant health, with the broader goal of identifying beneficial microbes that could be leveraged for sustainable crop improvement. She organizes and chairs the Seed Microbiome Working Group for early career researchers."
