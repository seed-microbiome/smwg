# The meetings are organized by me and Makrina Diakaki (Cc), who program the meetings' agenda and ensure that the group works following these criteria:
# • Members should be currently working on the topic of seed microbiomes in academia
# • Members should be doing a PhD or having completed a PhD no more than 3 years ago
# • Members should be willing to become an active member of the group"

- title: "Who We Are"
  team: "We are a group of early career researchers working on seed microbiomes. We communicate actively via quarterly online meetings and group on Discord. During the meetings, participants have the chance to present their work and receive feedback from others working in the same area of expertise. Our aim is to collaboratively advance science in our field and develop a network of academics with shared scientific interests."
  guidelines: "New members should be currently working on the topic of seed microbiomes in academia • Members should be doing a PhD or have recently completed their PhD and consider themselves early career researchers • Members should be willing to become actively involved by attending most meetings, giving at least one talk and participating in the discussions • MSc students and professors are not within this target group"
