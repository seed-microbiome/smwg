- date: September 10, 2026 at 4 pm CET
  title: Seed Transmitted Microbes have Agronomic Potential and are Foundational to the Microbiomes of Crop Plants
  presenter: "David Johnston-Monje"
  url: https://symbiotico.co/
  affiliation: "Universidad del Valle"
  abstract: "*Researcher Spotlight* is a seminar series highlighting the career paths, experiences, and insights of scientists working in the field of seed microbiomes. Each session features a researcher sharing their journey, challenges, and perspectives on building a career in microbial ecology, providing inspiration and guidance for early-career scientists and peers alike."
  photo: "david-johnston"
  biography: "David Johnston-Monje is a plant microbial ecologist who has hoped to discover and develop microbes that could be useful in plant agriculture. During his PhD at the University of Guelph, he studied the seed endophytes of maize and discovered that the majority of the plant microbiome is transmitted through the seed. His research career spans the International Potato Center (Peru), EMBRAPA Agrobiologia (Brazil), the International Center for Tropical Agriculture (Colombia), A&L Biologicals and Indigo Agriculture where he was the founding employee. He is Principal Investigator and Max Planck Tandem Group Leader at Universidad del Valle in Cali, Colombia, in cooperation with the Max Planck Institute for Plant Breeding Research. His ongoing research focuses on vertical transmission of plant microbiomes, identifying emerging plant pathogens and applied aspects of agricultural microbiology."