- date: March 5, 2025 at 4 pm CET
  title: Functional roles of seed endophytic bacteria in seedling development and biotic stress tolerance in maize
  presenter: "Gaurav Pal"
  url: https://cals.ncsu.edu/plant-and-microbial-biology/people/gaurav-pal/
  affiliation: "North Carolina State University"
  abstract: "Seeds are reservoirs of beneficial microbes that shape early plant development. However, their functional roles and mechanisms remain poorly understood. We isolated 23 SEB from three maize varieties and characterized their plant growth-promoting traits, including auxin production, phosphate solubilization, nitrogen fixation, and extracellular enzyme activity. Among these, Lysinibacillus sp. (ZM1) significantly enhanced root architecture, auxin levels, and nitrogen metabolism in maize seedlings, even under nitrogen-deficient conditions. Additionally, Bacillus velezensis (ZMW8) exhibited strong antifungal activity against Fusarium verticillioides and Rhizoctonia solani through lipopeptide production (bacillomycin D, fengycin), improving seedling survival and defense gene expression. Our findings address a critical gap in understanding how seed-associated microbes contribute to both growth promotion and disease protection, highlighting their potential as bioinoculants for sustainable maize cultivation." # For more info, please see our recent [paper](https://arxiv.org/abs/xxx.xxxx).
  photo: "gaurav-pal"
  biography: "Gaurav Pal is a Postdoctoral Researcher in Manuel Kleiner’s Lab at the Department of Plant and Microbial Biology, North Carolina State University, USA. He earned his M.Sc. and Ph.D. from Banaras Hindu University, India, where he investigated the functional roles of seed endophytic bacteria in maize seedling development and biotic stress tolerance. His current research focuses on functional plant–microbiome interactions using metaproteomics. Beyond research, Gaurav actively contributes to professional development initiatives at NC State, serving as Vice President of the Postdoctoral Association and previously as Chair of the Professional Development Committee."