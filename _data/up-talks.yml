- date: December 4, 2025 at 4 pm CET
  title: Fast and Spatial Isolation of Intact Arabidopsis Plastids via Affinity Purification
  presenter: "Pawan Kumar"
  url: https://community.apsnet.org/network/members/profile?UserKey=a45a7ec7-24ff-4963-b797-9a4f4caff5f0
  affiliation: "The University of Chicago"
  abstract: "Plastids are one of the three genome-containing compartments a plant's cell and are responsible for photosynthesis, production of cuticle components and various internal structures. To study their functions, plastids are isolated and purified using methods based on differential centrifugations. But these methods usually depend on taking plastids out of an organ as a whole, impossibilitating to study how organelles work at the cell-type level. Recently, Boussardon and Keech (2023) developed a method to isolate plastids from various cell types in Arabidopsis (IPTACT). This method involves tagging the outer membrane chloroplast protein 64 (TOC64) inside the cells followed by isolation using magnetic beads. Tissue-specific promoters achieve cell type specificity by only allowing plastids to biotinylate after biding to the magnetic beads. Here, we optimized the plastid isolation to include only intact plastids. Our initial data showed successfull isolation of intact plastids from four different Arabidopsis genotypes and from different kinds of leaf cells: p35STOC64-GFP lines (most plastid types), pCAB3TOC64-GFP lines (mesophyll only), pGCTOC64-GFP lines (guard cell only), and pEDS5TOC64-GFP lines (epidermis only). These intact plastids are amenable to further analyses, such as proteomics, metabolomics, and other biochemical analyses, advancing the study of plant-microbe interactions."
  photo: "pawan-kumar"
  biography: "Pawan Kumar is a Postdoctoral Researcher at the University of Chicago, USA. His work involves understanding how beneficial bacteria can boost plant immunity, focusing on what happens inside a plant's cells. Using advanced molecular-genetic tools, he takes a global snapshot of the plant's chemistry, including proteins, fats, and other key molecules to understand how bacteria switch on a 'better growth' program inside the plant. He is working to identify these specific molecular signals in Arabidopsis, and then applying it to other important crops like Camelina, which is used to make biofuel and oil. Dr. Kumar's previous research focused on the natural chemical defenses of plants, especially in crops like mustard (Brassica species). He studied a group of natural chemicals called glucosinolates and showed how crucial they are for protecting plants against various pests and diseases. He also developed new techniques to identify important genes linked to plant resilence, which ultimately contribute to crop breeding."

- date: March 5, 2026 at 4 pm CET
  title: Functional roles of seed endophytic bacteria in seedling development and biotic stress tolerance in maize
  presenter: "Gaurav Pal"
  url: https://cals.ncsu.edu/plant-and-microbial-biology/people/gaurav-pal/
  affiliation: "North Carolina State University"
  abstract: "Seeds are reservoirs of beneficial microbes that shape early plant development. However, their functional roles and mechanisms remain poorly understood. We isolated 23 SEB from three maize varieties and characterized their plant growth-promoting traits, including auxin production, phosphate solubilization, nitrogen fixation, and extracellular enzyme activity. Among these, <i>Lysinibacillus</i> sp. (ZM1) significantly enhanced root architecture, auxin levels, and nitrogen metabolism in maize seedlings, even under nitrogen-deficient conditions. Additionally, <i>Bacillus velezensis</i> (ZMW8) exhibited strong antifungal activity against <i>Fusarium verticillioides</i> and <i>Rhizoctonia solani</i> through lipopeptide production (bacillomycin D, fengycin), improving seedling survival and defense gene expression. Our findings address a critical gap in understanding how seed-associated microbes contribute to both growth promotion and disease protection, highlighting their potential as bioinoculants for sustainable maize cultivation. For more info see our [<b>publication</b>](https://doi.org/10.1016/j.micres.2021.126926)."
  photo: "gaurav-pal"
  biography: "Gaurav Pal is a Postdoctoral Researcher in Manuel Kleiner’s Lab at the Department of Plant and Microbial Biology, North Carolina State University, USA. He earned his M.Sc. and Ph.D. from Banaras Hindu University, India, where he investigated the functional roles of seed endophytic bacteria in maize seedling development and biotic stress tolerance. His current research focuses on functional plant–microbiome interactions using metaproteomics. Beyond research, Gaurav actively contributes to professional development initiatives at NC State, serving as Vice President of the Postdoctoral Association and previously as Chair of the Professional Development Committee."