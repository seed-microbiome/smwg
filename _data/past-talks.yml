- date: March 7, 2024 at 3 pm CET
  title: "Defining the Cultured and Uncultured Bacterial Fractions in Cannabis Seeds"
  presenter: "Carolina Lobato"
  url: https://cbclobato.github.io/
  affiliation: "Graz University of Technology"
  abstract: "Seeds provide a unique environment shaped by co-evolutionary processes, hosting diverse microbial communities. While metagenomic studies have uncovered an extended diversity of microorganisms, culture-based approaches remain crucial for understanding microbial potential and functional interactions. However, the factors influencing microbial culturability within seeds are not well understood. Our findings highlight the limitations of culture-based methods in capturing the full microbial diversity of Cannabis seeds and emphasize the importance of microbial interactions in determining culturability. The strong network connectivity of uncultured taxa suggests that interdependencies and competition within the seed microbiome may hinder the isolation of key bacterial groups. These insights provide a framework for refining cultivation strategies to recover ecologically significant microbes with potential agricultural applications."
  photo: "carolina-lobato"
  biography: "Carolina is a PhD candidate at the Institute of Environmental Biotechnology, Graz University of Technology. Her research explores how microbial interactions influence plant fitness and health, with a focus on seed microbial community assembly. She investigates the factors shaping microbiome composition and function, including microbial inheritance, environmental influences, and host traits. A key aspect of her work is understanding how these microbial assembly patterns impact plant health, with the broader goal of identifying beneficial microbes that could be leveraged for sustainable crop improvement."

