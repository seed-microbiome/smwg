  biography: "Itumeleng is a plant scientist and PI of the Plant Holobiont Lab at Stellenbosch University, his work focuses on understanding which assembly processes are delimiting the plant holobionts, as well as the evolutionary history of niche shifts and stability. He is particularly interested in understanding how plant holobionts are assembled and maintained, and the hologenome theory of evolution."
