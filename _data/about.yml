# • Members should be willing to become an active member of the group"

- title: "Goals & Guidelines"
  goals: "We are a group of PhD students and early career researchers working on seed microbiomes and actively communicating via quarterly meetings and Slack! During the meetings, participants have the chance to share their work and get feedback from their colleagues working in the same area of expertise."
  guidelines: "Members should be currently working on the topic of seed microbiomes in academia • Members should be doing a PhD or having completed a PhD no more than 3 years ago • Members should be willing to become an active member of the group"
