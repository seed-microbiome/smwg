- date: December 3, 2026 at 3 pm CET
  title: Impact of Seed Production Practices on the Seed Microbiome, its Multigenerational Transmission, and Potential for Crop Adaptability
  presenter: "Oscar Joubert"
  url: https://fr.linkedin.com/in/oscar-joubert-a0549b273
  affiliation: "INRAE"
  abstract: "The seed and its microbiome (including bacteria and fungi) are an integral part of the life cycle of the plant holobiont. Germination and seedling growth are crucial steps in crop production, affecting both yield and farmer income. Widespread agricultural practices in the seed industry and plant health regulations are mainly focused on pest management. They may interfere with the beneficial effects of the non-pathogenic fraction of the seed microbiome. Acknowledging the role of the seed microbiome in plant growth, abiotic and biotic stress tolerance cannot be neglected in order to reduce pesticide use, to mitigate and address the consequences of global warming on seed production. In light of these considerations, my thesis aims to explore, in collaboration with farmers involved in seed production, how their practices affect the seed holobiont. This thesis is structured around three central hypotheses: seed production practices (i) affect the seed microbiome, in terms of abundance, microbial diversity (bacteria and fungus) and seed quality (presence and abundance of seed-borne pathogens); (ii) affect the contribution of the seed microbiome to seedling microbiome assembly, the consequence of which may spread across the plant life cycle, over several generations; (iii) interfere with the role of the seed microbiome in crop adaptability to the biotic and abiotic environment."
  photo: "oscar-joubert"
  biography: "Oscar is a PhD student at the University of Angers (EmerSys team), supervised by Marie Simonin, studying how seed production practices affect the seed microbiome. Before this, he completed a BSc and an MSc degree in Biosciences at the ENS Lyon. He also committed to fairer, more sustainable food systems, through farming and collective cooking."

- date: December 3, 2026 at 3 pm CET
  title: EcoYeast - Ecology and Transmission of Seed-associated Yeasts
  presenter: "anais-bosc-bierne"
  url: https://irhs.angers-nantes.hub.inrae.fr/recherche/emergence-systematique-et-ecologie-des-bacteries-associees-aux-plantes/personnel_emersys/anais-bosc-bierne
  affiliation: "INRAE"
  abstract: "Yeasts are widespread in natural environments and can colonize different parts of plants, including seeds. However, despite growing interest in the seed microbiome, little is known about the ecology of seed-associated yeasts. Their environmental origins, how they colonize seeds and how they are transmitted remain largely unknown. My PhD aims to understand the factors that influence yeast colonization and transmission in seeds. The first objective is to study the diversity and distribution of seed-associated yeasts and determine whether some show a preference for the seed habitat where metabarcoding and culturomic datasets is used to identify potential environmental sources and colonization pathways. The second objective is to understand how yeasts are transmitted from mother plants to seeds and from seeds to seedlings. Controlled inoculation experiments are used to track yeast transmission and assess their effects on plant development. The third objective is to identify traits, such as stress tolerance and biofilm formation, that may help yeasts colonize seeds and be transmitted to seedlings. Comparative genomic analyses can also identify candidate genes involved in these processes. Together, these approaches provide a better understanding of the ecology, adaptation and transmission of seed-associated yeasts."
  photo: "anais-bosc-bierne"
  biography: "Anaïs is a first-year PhD student at the University of Angers, working across the EmerSys and FungiSem research teams at IRHS, under the supervision of Marie Simonin, Muriel Marchi and Natalia Guschinskaya. She holds a BSc in Plant Biology from the University of Angers and an MSc in Seed Biology and Technology from Institut Agro Rennes-Angers. Her background also includes studies in fine arts before moving into plant biology. She sees a shared creative dimension in both fields, which she enjoys exploring through scientific research, from developing research questions and designing experiments to analysing data through bioinformatics."
