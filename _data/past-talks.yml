  biography: "Marwa is a postdoctoral researcher of plant pathology at the Marche Polytechnic University (UNIVPM) in Italy. She received a PhD in 2020 from two universities: the National Agricultural Institute of Tunisia (INAT) and UNIVPM, with a very honorable mention in plant protection. Her research focus on detection and morphological and molecular identification of seed-borne fungi on cucurbits. She also studied seed transmission of the main diseases of cucurbits (e.g., Stagonosporopsis cucurbitacearum) and their control using essential oils and chitosan. She is a member of the Italian Phytopathological Society (SIPaV) and the American Phytopathological Society (APS), and is a member of the ISPP Seed Pathology Committee."

- date: December 1, 2022 at 3 pm CET
  title: "My Junior Experience in Cacao and Quinoa Seed Microbiome"
  presenter: "Cristián Andrés Salinas Castillo"
  url: # https://github.com/musterman
  affiliation: "Purdue University"
  abstract: "Quinoa is a promising crop for food security, due to its high nutritional content and adaptation to climate change. Most of the world yield comes from Peru and Bolivia and is exported to the US to produce manufactured food supplements. However, some regions in Peru are polluted with cadmium and quinoa grains absorb toxic quantities. The main objective of this project is to identify how cadmium changes the bacteria and fungi found inside the quinoa grains and if those microorganisms could have beneficial activities to decrease cadmium concentration in quinoa and final consumersʼ uptake. Microbes were isolated in vitro to assess biochemical activities which are beneficial to plant growth and decrease cadmium concentration in grains and tested in quinoa plants to assess a new approach to decrease cadmium pollution and produce healthier quinoa crops."
  photo: "cristian-salinas"
  biography: "Cristián is a PhD candidate in ecological sciences and engineering (ESE) at Purdue University, in the Dr. Hoagland Soil Microbial Ecology Lab. He works in plant microbiome and the effect of the environment on microbial composition and functions. He focus on studying the effect of crossing on the tomato seedborne microbiome and the induced systemic resistance via beneficial microorganisms."
