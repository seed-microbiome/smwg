- title: "Organizers"
  presenter: "Makrina Diakaki"
  url: https://www.wur.nl/en/persons/makrina-diakaki.htm
  affiliation: "Wageningen University & Research"
  photo: "makrina-diakaki1"
  biography: "Makrina is a Plant Biologist with a specialization in sustainable cropping systems. She started her PhD in July 2020 studying the role of the seed microbiome in seed health and seed resilience against pathogens. Makrina holds a BSc Hons in Biological Sciences (Plant Science) from the University of Edinburgh (UK), and a Plant Health Erasmus Mundus Joint Master Degree from the University of Goettingen (Germany) and the Polytechnic University of Valencia (Spain). She also completed a one year traineeship at the European Food Safety Authority (Italy) as part of the Pest Surveillance Working Group of the Plant Health team. Her academic interests include the seed microbiome, phytopathology, disease suppression, microbial ecology and sustainable approaches in agriculture, especially in relation to plant health. She organizes and chairs the Seed Microbiome Working Group for early career researchers."

- presenter: "Carolina Lobato"
  url: https://cbclobato.github.io/
  affiliation: "Heinrich Heine University Düsseldorf"
  photo: "carolina-lobato1"
  biography: "Carolina is a Postdoctoral researcher at the Institute for Biological Data Science. Her research explores plant-microbe interactions and its influence in plant fitness and health. She did her PhD at Graz University of Technology, with focus on seed microbial communities where she investigated factors shaping microbiome composition and function, with the broader goal of identifying beneficial microbes that could be leveraged for sustainable crop improvement. She organizes and chairs the Seed Microbiome Working Group for early career researchers."
