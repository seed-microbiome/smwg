- date: March 5, 2026 at 4 pm CET
  title: Functional roles of seed endophytic bacteria in seedling development and biotic stress tolerance in maize
  presenter: "Gaurav Pal"
  url: https://cals.ncsu.edu/plant-and-microbial-biology/people/gaurav-pal/
  affiliation: "North Carolina State University"
  abstract: "Seeds are reservoirs of beneficial microbes that shape early plant development. However, their functional roles and mechanisms remain poorly understood. We isolated 23 SEB from three maize varieties and characterized their plant growth-promoting traits, including auxin production, phosphate solubilization, nitrogen fixation, and extracellular enzyme activity. Among these, <i>Lysinibacillus</i> sp. (ZM1) significantly enhanced root architecture, auxin levels, and nitrogen metabolism in maize seedlings, even under nitrogen-deficient conditions. Additionally, <i>Bacillus velezensis</i> (ZMW8) exhibited strong antifungal activity against <i>Fusarium verticillioides</i> and <i>Rhizoctonia solani</i> through lipopeptide production (bacillomycin D, fengycin), improving seedling survival and defense gene expression. Our findings address a critical gap in understanding how seed-associated microbes contribute to both growth promotion and disease protection, highlighting their potential as bioinoculants for sustainable maize cultivation. For more info see our [<b>publication</b>](https://doi.org/10.1016/j.micres.2021.126926)."
  photo: "gaurav-pal"
  biography: "Gaurav is a Postdoctoral Researcher in Manuel Kleiner’s Lab at the Department of Plant and Microbial Biology, North Carolina State University, USA. He earned his M.Sc. and Ph.D. from Banaras Hindu University, India, where he investigated the functional roles of seed endophytic bacteria in maize seedling development and biotic stress tolerance. His current research focuses on functional plant–microbiome interactions using metaproteomics. Beyond research, Gaurav actively contributes to professional development initiatives at NC State, serving as Vice President of the Postdoctoral Association and previously as Chair of the Professional Development Committee."

- date: March 5, 2026 at 4 pm CET
  title: Fruit function beyond dispersal - effect of fruit decomposition on the plant microbiome assembly
  presenter: "Daniel Höfle"
  url: https://www.atb-potsdam.de/de/ueber-uns/team/mitarbeiter/person/daniel-hofle
  affiliation: "Leibniz Institute for Agricultural Engineering and Bioeconomy"
  abstract: "Fruits have long been recognized for their role in seed dispersal, yet their influence after falling to the ground has remained largely unexplored. Our new study published in <i>New Phytologist</i> challenges this view by demonstrating that fruit decomposition itself can actively shape the soil and plant microbiome with potential implications for seedling establishment, plant health, and ecological inheritance. Using tomato and chili as model systems, we show that decomposing fruits significantly alter soil chemistry and drive shifts in bacterial community composition, increasing diversity and enriching specific microbial functions. The consequences were that fruit presence reduced seed germination rates and affected early plant growth. By highlighting fruit decomposition as an overlooked but ecologically meaningful process, our work expands the classical view of fruit function and opens new directions for understanding microbial inheritance, early plant microbiome assembly, and the broader ecological role of fruit traits. For more info see our [<b>publication</b>](https://nph.onlinelibrary)."
  photo: "daniel-hoefle"
  biography: "Daniel is a microbiologist with a background in molecular biology and molecular microbiology. He earned his master’s degree from the University of Graz, Austria, where he built a strong foundation in microbial genetics, molecular biology, and host-microbe interactions. Since 2022, he is a doctoral researcher at the Leibniz Institute for Agricultural Engineering and Bioeconomy (ATB) in Potsdam, Germany. His research focuses on the structure and function of soil and plant-associated microbiomes and their response to environmental change. He is particularly interested in the seed microbiome and microbial inheritance in plants, and in examining how environmental factors and parental transmission shape the plant-associated microbiome."