  photo: "gillian-bergmann"
  biography: "Gillian is an ecology PhD candidate in the labs of Johan Leveau and Rachel Vannette at UC Davis, as well as a visiting graduate researcher with the EmerSys team at INRAE-IRHS. She is particularly interested in how various processes can contribute to microbial transmission between floral stigmas and developing seeds across spatial scales. In the long-term, she aims to study microbial community assembly processes across the seed life cycle, document the microbial diversity of seed communities, and relate assembly outcomes to seedling health. She is an NSF Graduate Research Fellow and a UC Davis Dean's Distinguished Graduate Fellow."

