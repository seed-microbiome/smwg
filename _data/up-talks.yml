  biography: "Davide is a Post-doc in Kew Science in the UK, and is interested in seed redox biology with emphasis on antioxidants in longevity and germination. He is particularly interested in seed metabolic resumption during germination and ageing, and seed-microbe interactions alongside storage, germination, and early seedling growth."

