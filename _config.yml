baseurl: "https://seed-microbiome.github.io/smwg"
color-scheme: "#334279" # the scheme can be any HEX code like "#00aa55"

sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages

exclude:
  - .sass-cache

title: "Seed Microbiome Working Group"
description: "Seminars on seed microbiome research"

information: This seminar series aims to provide a platform for early career researchers (including PhD candidates) to present their research and stimulate discussion on a diverse set of topics related to seed microbiomes.

registration: "https://forms.gle/T64wNQcWbBGFcG7U6"

details: The presentations take place online (~20 min + 10 min Q&A) via **Teams**, on the first Thursday of the month at 16:00-17:30 CET every three months (September, December, March and June). To stimulate discussion and allow for the presentation of ongoing work, the talks are not recorded. # unless the speaker separately requests for it.
# The schedule is in CET European (Summer) Time, click [here](https://whattime.is/en/time-zone/EET/) for EET (winter time) conversion.

organizers: "[Carolina Lobato](https://github.com/cbclobato) and [Makrina Diakaki](https://github.com/MakrinaDiakaki)"
