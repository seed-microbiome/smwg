- title: "Organizers"
- presenter: "Carolina Lobato"
  url: https://cbclobato.github.io/
  affiliation: "Heinrich Heine University Düsseldorf"
  photo: "carolina-lobato1"
  biography: "Carolina is a microbial ecologist with a strong interest in plant-microbe interactions and the role of seed-associated microbial communities in plant health. She is working at the Institute for Biological Data Science in the Heinrich Heine University Düsseldorf as a postdoctoral researcher. Her research explores plant-microbe interactions, focusing on the genetic determinants underlying seed microbiome modulation. She completed PhD at Graz University of Technology, Austria, where she investigated how domestication shapes seed microbiomes and their functional contributions to plant fitness. She organizes and chairs the Seed Microbiome Working Group for early career researchers."

- presenter: "Cristian Salinas-Castillo"
  url: https://www.linkedin.com/in/casalinasc/
  affiliation: "Purdue University"
  photo: "cristian-salinas"
  biography: "Cristian is a biologist working in plant–microbial interactions. He is currently a graduate research assistant in the Department of Horticulture and Landscape Architecture at Purdue University, USA, where he investigates the tomato seed microbiome and its effect for plant health and stress response.  Cristian holds a Biology BS from Universidad Nacional de Colombia, where he explored the cocoa seed-borne microbiome and its plant growth promotion traits. Later, during a short-term internship at Purdue University, he studied the quinoa seed microbiome under cadmium stress. He has been a member of the Seed Microbiome Working Group since 2022 and participates as an organizer since December 2025."

- presenter: "Gillian Bergmann"
  url: gebergmann.weebly.com
  affiliation: "Leibniz Institute for Agricultural Engineering and Bioeconomy Potsdam"
  photo: "gillian-bergmann"
  biography: "Gillian is a microbial ecologist interested in the assembly and function of seed microbiota of wild and cultivated plants. She currently works as a postdoctoral researcher in Ahmed Abdelfattah's group at the Leibniz Institute for Agricultural Engineering and Bioeconomy in Potsdam, Germany. Her research explores how seed microbiota persist over time, and how plant traits may modulate seed microbiota composition. She received her PhD in Ecology from the University of California-Davis, where she studied the contributions of floral transmission to bacterial community assembly in developing seeds. She is a co-chair of the Seed Microbiome Working Group and an organizer for the scientific program at SeedCon."