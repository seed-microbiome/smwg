- title: "Organizers"
  presenter: "Makrina Diakaki"
  url: https://www.wur.nl/en/persons/makrina-diakaki.htm
  affiliation: "Wageningen University & Research"
  photo: "makrina-diakaki1"
  biography: "Makrina is a phytopathologist and microbial ecologist specialising in sustainable cropping systems. She recently obtained her PhD at Wageningen University and Research, the Netherlands where she explored the involvement of seed microbiota in the suppression of plant diseases. Her academic interests include the seed, plant and soil microbiome, phytopathology, disease suppression, microbial ecology and sustainable approaches in agriculture, especially in relation to plant health. She holds a Biological Sciences BSc from the University of Edinburgh, Scotland as well as a Crop Protection MSc from the University of Göttingen, Germany and a Plant Health and Sustainable Cropping Systems MSc from the Polytechnic University of Valencia, Spain. She organizes and chairs the Seed Microbiome Working Group for early career researchers."

- presenter: "Carolina Lobato"
  url: https://cbclobato.github.io/
  affiliation: "Heinrich Heine University Düsseldorf"
  photo: "carolina-lobato1"
  biography: "Carolina is a microbial ecologist with a strong interest in plant-microbe interactions and the role of seed-associated microbial communities in plant health. She is working at the Institute for Biological Data Science in the Heinrich Heine University Düsseldorf as a postdoctoral researcher. Her research explores plant-microbe interactions, focusing on the genetic determinants underlying seed microbiome modulation. She completed PhD at Graz University of Technology, Austria, where she investigated how domestication shapes seed microbiomes and their functional contributions to plant fitness. She organizes and chairs the Seed Microbiome Working Group for early career researchers."
